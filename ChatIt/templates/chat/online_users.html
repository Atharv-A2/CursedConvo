<!DOCTYPE html>
<html>
<head>
    <title>Online Users</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #2f3136;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        #online-users-container {
            background: rgba(0, 0, 0, 0.5); /* Transparent background with slight opacity */
            backdrop-filter: blur(10px); /* Apply blur effect */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 300px;
            padding: 20px;
        }
        h2 {
            color: #7289da; /* Discord blue */
            text-align: center;
        }
        #online-users-list {
            list-style-type: none;
            padding: 0;
        }
        #online-users-list li {
            padding: 10px;
            border-bottom: 1px solid #444;
            background-color: #202225; /* Dark background for each user item */
        }
        #online-users-list li:last-child {
            border-bottom: none;
        }

        /* Background image with blur effect */
        body {
            background: url('https://png.pngtree.com/thumb_back/fh260/background/20230516/pngtree-mountain-wallpaper-hd-wallpapers-image_2575213.jpg') no-repeat center center fixed;
            background-size: cover;
            backdrop-filter: blur(8px); /* Apply blur effect to the body */
        }
    </style>
</head>
<body>
    <div id="online-users-container">
        <h2>Online Users</h2>
        <ul id="online-users-list"></ul>
    </div>

    <script>
        const socket = new WebSocket(`ws://${window.location.host}/ws/online/`);

        // Handle incoming messages
        socket.onmessage = function (e) {
            const users = JSON.parse(e.data).users;
            const userList = document.getElementById('online-users-list');
            userList.innerHTML = users.map(user => `<li>${user}</li>`).join('');
        };
    </script>
</body>
</html>
